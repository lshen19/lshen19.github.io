<html>
    <head> 
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title> Home </title>

       
        <link rel="stylesheet" href="css/bootstrap.min.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link rel="stylesheet" href="css/custom.css"/>
    </head>

    <body>
        <div class="container-fluid">
            <header class="row">
                Justice for the Chinese Elderly
            </header>
            <div class="row">
                <div class="col-md-12">
                    <nav class="navbar navbar-expand-lg bg-body-tertiary">
                        <div class="container-fluid">
                          <a class="navbar-brand" href="index.html">Save the Elderly</a>
                          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                          </button>
                          <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                              <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="learn.html">Learn</a>
                              </li>
                              <li class="nav-item">
                                <a class="nav-link active" href="donate.html">Help</a>
                              </li>
                            </ul>
                                <a href="donate.html">
                                    <button class="btn btn-outline-success" type="submit">Donate</button>
                                </a>
                          </div>
                        </div>
                      </nav>
                </div>
                <div class="row marginTop" id="mainArea">
                    <div class="col-md-6">
                        <figure class="figure pad20">
                            <img src="img/fightvirus.jpeg" class="figure-img img-fluid rounded" alt="Hope wil never die">
                            <figcaption class="figure-caption text-end">Fight for racial justice</figcaption>
                          </figure>
                    </div>
                    <div class="col-md-6">
                        <div class="row pad20">
                            <div class="col-md-12">
                                <h3>
                                    Every penny counts
                                    <small class="text-body-secondary">towards helping out the most valuable members of our community</small>
                                </h3>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 pad20">
                                <button type="button" class="btn btn-light donationAmount">$10</button>
                            </div>
                            <div class="col-md-4 pad20">
                                <button type="button" class="btn btn-light donationAmount">$50</button>
                            </div>
                            <div class="col-md-4 pad20">
                                <button type="button" class="btn btn-light donationAmount">$100</button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 pad20">
                                <button type="button" class="btn btn-light donationAmount">$250</button>
                            </div>
                            <div class="col-md-4 pad20">
                                <button type="button" class="btn btn-light donationAmount">$500</button>
                            </div>
                            <div class="col-md-4 pad20">
                                <button type="button" class="btn btn-light donationAmount">$1000</button>
                            </div>
                        </div>
                        <div class="row lpadding20">
                            <div class="col-md-12">
                                <p>Or you can enter the amount that you'd prefer to contribute:</p>
                            </div>
                        </div>
                        <div class="row lpadding20">
                            
                            <div class="col-md-8">
                                <div class="input-group mb-3">
                                    <span class="input-group-text">$</span>
                                    <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)">
                                    <span class="input-group-text">.00</span>
                                  </div>
                            </div>
                            <div class="col-md-4"></div>
        
                        </div>
                        <div class="row lpadding20 pad20">
                            <div class="col-md-12">
                                <button type="button" class="btn btn-success">DONATE NOW</button>
                            </div>
                        </div>
                    </div>
                </div>
                <footer class="row marginTop">
                    <div class="col-md-6">
                        <h1 class="display-5">Support the Elderly</h1>
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="Enter your Email" aria-label="Enter your Email" aria-describedby="button-addon2">
                            <button class="btn btn-outline-secondary" type="button" id="button-addon2">Join</button>
                        </div>
                        <div class="socialDiv d-flex justify-content-between">
                          <i class="bi bi-facebook"></i>
                          <i class="bi bi-linkedin"></i>
                          <i class="bi bi-instagram"></i>
                          <i class="bi bi-tiktok"></i>
                        </div>
                    </div>
                    <div class="col-md-6 d-flex justify-content-center footerNav">
                        <ul>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="learn.html">Learn</a>
                            </li>
                            <li class="nav-item">
                            <a class="nav-link" href="donate.html">Help</a>
                            </li>
                            <li>
                                <a href="donate.html">
                                    <button class="btn btn-success" type="submit">Donate</button>
                                  </a>
                            </li>
                        </ul>
                    </div>
                </footer>
            </div>
            <script src="javascript/bootstrap.bundle.min.js">
            </script>
        </body>
    </html>
